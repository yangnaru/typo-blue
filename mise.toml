[tools]
node = "latest"
pnpm = "latest"
"npm:pnpm" = "latest"
# What deploy.py runs. zstd is the one mise cannot install -- it is Homebrew's
# (`brew install zstd`), and the server's too; only deploy:local uses it.
python = "3.13"
# What `deploy` waits for the image build with.
gh = "latest"

[tasks.deploy]
description = "Switch the server to origin/main, as GitHub Actions built it (see deploy.py)"
run = "python deploy.py deploy"

[tasks."deploy:local"]
description = "Build origin/main here, ship it over ssh and switch the server to it (see deploy.py)"
run = "python deploy.py deploy:local"
