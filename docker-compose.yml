services:
  typo-blue:
    # Pulled from GHCR or built on another machine by deploy.py, and
    # deploy-server.sh points this tag at it before recreating the container.
    # There is deliberately no `build:`: a build here is what used to peg this
    # machine's CPU on every deploy.
    image: typo-blue:current
    # Without a `build:`, a missing image would send compose to Docker Hub for
    # someone else's `typo-blue`. Fail instead.
    pull_policy: never
    container_name: typo-blue
    env_file: ".env"
    networks:
      - typo-blue-network
    restart: always
    # Forwards SIGTERM to the app, which as PID 1 would otherwise be exempt from
    # the default action and sit out the ten seconds until Docker kills it.
    init: true
    ports:
      - "23000:3000"
    # This machine is shared, so the app gets a ceiling rather than whatever
    # the host allows. It sits around 120MiB; the heap cap makes V8 collect
    # harder before it nears the container's, where the kernel would kill it
    # (and `restart: always` bring it back).
    environment:
      NODE_OPTIONS: --max-old-space-size=256
    mem_limit: 512m
    # The email worker runs inside this process (see instrumentation.ts); the
    # typo-blue-email-worker container it used to have is removed as an orphan.

networks:
  typo-blue-network:
    driver: bridge
