services:
  typo-blue:
    env_file: ".env"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL}
        NEXT_PUBLIC_DOMAIN: ${NEXT_PUBLIC_DOMAIN}
        NEXT_PUBLIC_R2_PUBLIC_URL: ${NEXT_PUBLIC_R2_PUBLIC_URL}
    container_name: typo-blue
    ports:
      - "23000:3000"
    networks:
      - typo-blue-network
    restart: always

  typo-blue-email-worker:
    env_file: ".env"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL}
        NEXT_PUBLIC_DOMAIN: ${NEXT_PUBLIC_DOMAIN}
        NEXT_PUBLIC_R2_PUBLIC_URL: ${NEXT_PUBLIC_R2_PUBLIC_URL}
    container_name: typo-blue-email-worker
    networks:
      - typo-blue-network
    restart: always
    command: ["pnpm", "run", "email-worker"]

networks:
  typo-blue-network:
    driver: bridge
